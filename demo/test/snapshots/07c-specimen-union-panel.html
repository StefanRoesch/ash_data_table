<dialog aria-labelledby="specimen-panel-title" class="m-0 ms-auto h-dvh max-h-dvh w-full max-w-md overflow-y-auto bg-base-100 p-6 text-base-content shadow-xl backdrop:bg-black/40 forced-colors:border" data-ask="changed" id="specimen-panel" phx-hook=".Panel" phx-mounted="[[&quot;ignore_attrs&quot;,{&quot;attrs&quot;:[&quot;open&quot;]}]]" phx-target="T">
<form id="specimen-panel-form" method="put" novalidate="" phx-change="panel_validate" phx-submit="panel_submit" phx-target="T">
<h2 class="mb-4 text-lg font-semibold" id="specimen-panel-title">A union: uuid-1</h2>
<div class="fieldset mb-2" data-field="a_union">
<div aria-labelledby="specimen-panel-f-a_union-label" data-union="" id="specimen-panel-f-a_union" role="group">
<span class="label mb-1 text-base-content" id="specimen-panel-f-a_union-label">
<span data-label="">A union</span>
</span>
<div class="ps-4">
<input name="panel[a_union][_of]" type="hidden" value="number"/>
<div class="fieldset mb-2" data-field="a_union._union_type">
<label class="label mb-1 text-base-content" for="specimen-panel-f-a_union-kind">
<span data-label="">Kind</span>
</label>
<select class="select w-full not-focus:not-aria-invalid:[--input-color:color-mix(in_oklab,var(--color-base-content)_50%,transparent)] aria-invalid:[--input-color:color-mix(in_oklab,var(--color-error)_70%,var(--color-base-content))]" id="specimen-panel-f-a_union-kind" name="panel[a_union][_union_type]">
<option value="">
</option>
<option selected="" value="number">
          Number
        </option>
<option value="text">
          Text
        </option>
<option value="shade">
          Shade
        </option>
<option value="address">
          Address
        </option>
</select>
</div>
<div class="fieldset mb-2" data-field="a_union._union_value">
<label class="label mb-1 text-base-content" for="specimen-panel-f-a_union-value">
<span data-label="">Number</span>
</label>
<input class="input w-full not-focus:not-aria-invalid:[--input-color:color-mix(in_oklab,var(--color-base-content)_50%,transparent)] aria-invalid:[--input-color:color-mix(in_oklab,var(--color-error)_70%,var(--color-base-content))]" id="specimen-panel-f-a_union-value" min="0" name="panel[a_union][_union_value]" step="1" type="number" value="12"/>
</div>
</div>
</div>
</div>
<div class="mt-6 flex justify-end gap-2">
<button class="btn" data-cancel="" id="specimen-panel-cancel" type="button">
        Cancel
      </button>
<button class="btn btn-primary" id="specimen-panel-submit" type="submit">
        Save
      </button>
</div>
</form>
</dialog>
